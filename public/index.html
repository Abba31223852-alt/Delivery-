<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Easy Buy</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Inter',sans-serif; background:#070b14; color:#fff; padding:20px; }
  .lang-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:80vh; text-align:center; }
  .lang-screen h1 { font-size:34px; font-weight:900; margin-bottom:10px; }
  .lang-screen h1 span { color:#00d4ff; }
  .lang-screen .sub { color:rgba(255,255,255,0.55); font-size:16px; margin-bottom:8px; }
  .lang-screen .sub-ha { color:rgba(255,255,255,0.55); font-size:16px; margin-bottom:35px; }
  .lang-btns { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; }
  .lang-btn { background:rgba(255,255,255,0.04); border:2px solid rgba(255,255,255,0.12); color:#fff; padding:28px 40px; border-radius:20px; font-weight:800; font-size:20px; cursor:pointer; transition:.25s; min-width:180px; }
  .lang-btn:hover, .lang-btn:active { border-color:#00d4ff; background:rgba(0,212,255,0.08); transform:translateY(-3px); }
  .lang-btn .flag { font-size:36px; display:block; margin-bottom:12px; }
  .site { display:none; }
  .lang-toggle { position:fixed; top:14px; right:14px; background:rgba(0,212,255,0.15); border:1px solid rgba(0,212,255,0.4); color:#00d4ff; padding:8px 16px; border-radius:50px; font-weight:700; font-size:13px; cursor:pointer; z-index:100; }
  h1.site-title { font-size:22px; margin-bottom:10px; }
  h1.site-title span { color:#00d4ff; }
  .sub { color:rgba(255,255,255,0.5); font-size:13px; margin-bottom:16px; }

  .info-banner {
    background:linear-gradient(135deg,rgba(0,212,255,0.12),rgba(0,114,255,0.08));
    border:1px solid rgba(0,212,255,0.3);
    border-radius:14px; padding:16px 18px; margin-bottom:24px;
    font-size:14px; line-height:1.7;
  }
  .info-banner strong { color:#00d4ff; }

  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:20px; }
  .card { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); border-radius:18px; padding:18px; }
  .card-img { width:100%; height:200px; background:#0a1220; border-radius:12px; overflow:hidden; margin-bottom:14px; display:flex; align-items:center; justify-content:center; }
  .card-img img { width:100%; height:100%; object-fit:contain; }
  .card-fallback { width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; background:linear-gradient(135deg,#0a1220,#0f1a30); }
  .card-fallback .badge { font-size:10px; font-weight:800; letter-spacing:2px; color:#00d4ff; padding:4px 12px; border-radius:50px; background:rgba(0,212,255,0.1); border:1px solid rgba(0,212,255,0.3); margin-bottom:10px; }
  .card-fallback .shape { width:60px; height:110px; border:2px solid rgba(0,212,255,0.5); border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:26px; margin-bottom:10px; }
  .card-fallback .name { font-size:13px; font-weight:800; }
  .card h3 { font-size:16px; font-weight:800; margin-bottom:4px; }
  .card p { font-size:12px; color:rgba(255,255,255,0.5); margin-bottom:12px; }
  .dp { background:rgba(0,212,255,0.08); border:1px solid rgba(0,212,255,0.2); border-radius:10px; padding:10px; text-align:center; margin-bottom:12px; }
  .dp .lbl { font-size:10px; text-transform:uppercase; color:rgba(255,255,255,0.6); letter-spacing:1px; }
  .dp .amt { font-size:20px; font-weight:900; color:#00d4ff; }
  .plan-lbl { font-size:12px; color:rgba(255,255,255,0.5); margin-bottom:6px; font-weight:600; }
  .plan-tabs { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; margin-bottom:12px; }
  .plan-tab { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); color:rgba(255,255,255,0.75); padding:10px 2px; border-radius:8px; font-size:11px; font-weight:800; cursor:pointer; text-align:center; line-height:1.2; }
  .plan-tab .mo { font-size:13px; display:block; }
  .plan-tab .wk { font-size:9px; opacity:0.7; display:block; margin-top:2px; }
  .plan-tab.active { background:linear-gradient(135deg,#00d4ff,#0072ff); color:#fff; border-color:transparent; }
  .plan-tab.disabled { opacity:0.3; cursor:not-allowed; }
  .selected-box { background:rgba(0,212,255,0.08); border:1px solid rgba(0,212,255,0.3); border-radius:10px; padding:12px; margin-bottom:12px; text-align:center; }
  .selected-box .lbl { font-size:10px; text-transform:uppercase; color:rgba(255,255,255,0.6); letter-spacing:1px; margin-bottom:4px; }
  .selected-box .val { font-size:18px; font-weight:900; color:#00d4ff; }
  .selected-box .sub { font-size:12px; color:rgba(255,255,255,0.6); margin-top:4px; margin-bottom:0; }
  .row { display:flex; justify-content:space-between; font-size:13px; padding:4px 0; }
  .row .k { color:rgba(255,255,255,0.55); }
  .row .v { font-weight:700; }
  .row.total { border-top:1px solid rgba(255,255,255,0.08); margin-top:6px; padding-top:8px; }
  .row.total .v { color:#00d4ff; font-size:15px; }
  .order-btn { width:100%; background:linear-gradient(135deg,#00d4ff,#0072ff); color:#fff; border:none; padding:12px; border-radius:10px; font-weight:800; font-size:14px; cursor:pointer; margin-top:10px; }
  .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:2000; align-items:center; justify-content:center; padding:20px; overflow-y:auto; }
  .overlay.show { display:flex; }
  .modal { background:#0d1220; border:1px solid rgba(0,212,255,0.25); border-radius:20px; padding:25px 20px; max-width:480px; width:100%; max-height:92vh; overflow-y:auto; position:relative; }
  .close-x { position:absolute; top:15px; right:15px; background:rgba(255,255,255,0.06); border:none; color:#fff; width:34px; height:34px; border-radius:50%; font-size:18px; cursor:pointer; }
  .modal h2 { font-size:20px; margin-bottom:6px; }
  .modal .st { color:rgba(255,255,255,0.5); font-size:13px; margin-bottom:18px; }
  .big-badge { background:linear-gradient(135deg,#00d4ff,#0072ff); border-radius:14px; padding:16px; text-align:center; margin-bottom:16px; }
  .big-badge .lbl { font-size:11px; text-transform:uppercase; letter-spacing:2px; opacity:0.9; margin-bottom:4px; }
  .big-badge .val { font-size:26px; font-weight:900; }
  .big-badge .sub { font-size:13px; opacity:0.95; margin-top:4px; margin-bottom:0; color:#fff; }
  .modal input, .modal textarea { width:100%; padding:12px 14px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:10px; color:#fff; font-size:14px; outline:none; margin-bottom:10px; font-family:'Inter',sans-serif; }
  .wa-btn { width:100%; background:linear-gradient(135deg,#25D366,#128C7E); color:#fff; border:none; padding:16px; border-radius:12px; font-weight:800; font-size:16px; cursor:pointer; margin-top:6px; }
  .cancel-btn { width:100%; background:rgba(255,255,255,0.06); color:#fff; border:1px solid rgba(255,255,255,0.15); padding:12px; border-radius:12px; font-weight:700; cursor:pointer; font-size:14px; margin-top:8px; }
</style>
</head>
<body>


<div class="lang-screen" id="langScreen">
  <h1>Easy <span>Buy</span></h1>
  <p class="sub">Choose your language</p>
  <p class="sub-ha">Zaɓi harshen da kake so</p>
  <div class="lang-btns">
    <button class="lang-btn" onclick="setLang('en')"><span class="flag">🇬🇧</span>English</button>
    <button class="lang-btn" onclick="setLang('ha')"><span class="flag">🇳🇬</span>Hausa</button>
  </div>
</div>

<div class="site" id="site">
  <button class="lang-toggle" onclick="showLangScreen()"><span id="langToggleText">HA</span></button>
  <h1 class="site-title">Easy <span>Buy</span></h1>
  <p class="sub" id="siteSub">Pick a phone. Pay small small.</p>

  <div class="info-banner" id="infoBanner"></div>

  <div class="grid" id="grid"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <button class="close-x" onclick="closeModal()">✕</button>
    <h2 id="modalTitle">Place Your Order</h2>
    <p class="st" id="modalSub">Fill in your details</p>
    <div class="big-badge" id="planBadge"></div>
    <div id="summary"></div>
    <input type="text" id="cName" placeholder="Full Name">
    <input type="tel" id="cPhone" placeholder="Phone Number">
    <input type="text" id="cAddress" placeholder="Address">
    <textarea id="cNotes" placeholder="Any notes? (optional)" rows="2"></textarea>
    <button class="wa-btn" onclick="sendWhatsApp()" id="waBtn">Send Order via WhatsApp</button>
    <button class="cancel-btn" onclick="closeModal()" id="cancelBtn">Cancel</button>
  </div>
</div>

<script>
const WHATSAPP_NUMBER = "2349123915098";

const PLAN_INFO = {
  13: { en:{months:"3 Months", payments:"13 payments"}, ha:{months:"Watanni 3", payments:"Biya sau 13"} },
  17: { en:{months:"4 Months", payments:"17 payments"}, ha:{months:"Watanni 4", payments:"Biya sau 17"} },
  26: { en:{months:"6 Months", payments:"26 payments"}, ha:{months:"Watanni 6", payments:"Biya sau 26"} },
  39: { en:{months:"9 Months", payments:"39 payments"}, ha:{months:"Watanni 9", payments:"Biya sau 39"} }
};

const T = {
  en: {
    tagline: "Pick a phone. Pay small small.",
    downPayment: "Down Payment",
    choosePlan: "Choose your payment plan:",
    youSelected: "You selected",
    orderBtn: "Order This Phone",
    modalTitle: "Place Your Order",
    modalSub: "Fill in your details and send via WhatsApp",
    changePlan: "Change plan:",
    weekly: "Weekly payment",
    totalOutstanding: "Total Outstanding",
    totalCost: "Total Cost",
    name: "Full Name",
    phone: "Phone Number",
    address: "Address",
    notes: "Any notes? (optional)",
    send: "Send Order via WhatsApp",
    cancel: "Cancel",
    switchLang: "HA",
    info: "💡 <strong>How payment works:</strong> You pay <strong>every 8 days</strong> (the same day each week). If you take the phone today, your next payment is due in <strong>7 days</strong>. Longer plans mean lower weekly payments but a higher total.",
    confirmMsg: "Please fill in Name, Phone, and Address"
  },
  ha: {
    tagline: "Zaɓi waya. Biya kaɗan-kaɗan.",
    downPayment: "Kuɗin Farko",
    choosePlan: "Zaɓi shirin biyan ku:",
    youSelected: "Ka zaɓa",
    orderBtn: "Yi Oda Wannan Wayar",
    modalTitle: "Yi Odarka",
    modalSub: "Cika bayaninka sannan ka aika ta WhatsApp",
    changePlan: "Canza shiri:",
    weekly: "Biyan mako",
    totalOutstanding: "Jimlar da ya Rage",
    totalCost: "Jimlar Kuɗi",
    name: "Cikakken Suna",
    phone: "Lambar Waya",
    address: "Adireshi",
    notes: "Wani bayani? (na zaɓi)",
    send: "Aika Oda ta WhatsApp",
    cancel: "Sokewa",
    switchLang: "EN",
    info: "💡 <strong>Yadda biya yake aiki:</strong> Kuna biya <strong>duk bayan kwana 8</strong> (wannan rana kowace mako). Idan ka ɗauki wayar yau, biya na gaba zai kasance cikin <strong>kwana 8</strong>. Dogon shiri yana nufin ƙaramin biyan mako amma jimlar kuɗi ya fi.",
    confirmMsg: "Da fatan za a cika Suna, Lambar Waya, da Adireshi"
  }
};

let LANG = "en";

const phones = [
  { id:1, name:"Itel A100cs", model:"A6611L 64/2 GB Vintage Green", brand:"Itel", dp:33240, w13:9374, w17:7669, w26:null, w39:null, image:"/images/itel-a100cs.png" },
  { id:2, name:"Itel A300+", model:"A681L 64/4 GB Black", brand:"Itel", dp:44070, w13:12428, w17:10168, w26:7626, w39:5885, image:"/images/itel-a300-plus.png" },
  { id:3, name:"Itel A300+", model:"A681L 128/4 GB Black", brand:"Itel", dp:52800, w13:14890, w17:12182, w26:9136, w39:7051, image:"/images/itel-a300-plus.png" },
  { id:4, name:"Itel A100CS", model:"A6611L 32/2 GB Red", brand:"Itel", dp:29970, w13:8452, w17:6915, w26:5186, w39:4002, image:"/images/itel-a100cs.png" },
  { id:5, name:"Itel CITY 200s", model:"C681LN 128/4 GB Gray", brand:"Itel", dp:55500, w13:15651, w17:12805, w26:9603, w39:7411, image:"" },
  { id:6, name:"Infinix HOT 70", model:"X6895 128/4 GB Grey", brand:"Infinix", dp:67470, w13:19027, w17:15567, w26:11675, w39:9010, image:"" },
  { id:7, name:"Infinix HOT 70", model:"X6895B 256/6 GB Grey", brand:"Infinix", dp:89970, w13:25373, w17:20759, w26:15568, w39:12014, image:"" },
  { id:8, name:"TECNO Spark 50", model:"128/4 GB Grey", brand:"TECNO", dp:64380, w13:18156, w17:14854, w26:11140, w39:8597, image:"/images/tecno-spark-50.png" },
  { id:9, name:"TECNO Spark 50 Pro", model:"KO5 128/6 GB Black", brand:"TECNO", dp:100440, w13:28325, w17:23174, w26:17379, w39:13413, image:"/images/tecno-spark-50-pro.png" },
  { id:10, name:"TECNO POP 10 Pro", model:"KM4k 128/4 GB Nebula Violet", brand:"TECNO", dp:43344, w13:12224, w17:10001, w26:7500, w39:5788, image:"/images/tecno-pop-10-pro.png" },
  { id:11, name:"TECNO Pop 20", model:"Kn3 64/4 GB Grey", brand:"TECNO", dp:43088, w13:10708, w17:8031, w26:6198, w39:null, image:"/images/tecno-pop-20.png" }
];

function formatNaira(n) { return '₦' + n.toLocaleString('en-NG'); }
function t(key) { return T[LANG][key]; }
function planInfo(weeks) { return PLAN_INFO[weeks][LANG]; }

function setLang(lang) {
  LANG = lang;
  try { localStorage.setItem('easybuy_lang', lang); } catch(e) {}
  document.getElementById('langScreen').style.display = 'none';
  document.getElementById('site').style.display = 'block';
  document.getElementById('langToggleText').textContent = t('switchLang');
  applyTranslations();
  renderCards();
}

function showLangScreen() {
  document.getElementById('langScreen').style.display = 'flex';
  document.getElementById('site').style.display = 'none';
}

function applyTranslations() {
  document.getElementById('siteSub').textContent = t('tagline');
  document.getElementById('infoBanner').innerHTML = t('info');
  document.getElementById('modalTitle').textContent = t('modalTitle');
  document.getElementById('modalSub').textContent = t('modalSub');
  document.getElementById('waBtn').textContent = t('send');
  document.getElementById('cancelBtn').textContent = t('cancel');
  document.getElementById('cName').placeholder = t('name');
  document.getElementById('cPhone').placeholder = t('phone');
  document.getElementById('cAddress').placeholder = t('address');
  document.getElementById('cNotes').placeholder = t('notes');
}

function cardImageHTML(p) {
  if (p.image && p.image.trim() !== "") {
    return '<img src="' + p.image + '" alt="' + p.name + '" onerror="this.parentElement.innerHTML=fallbackHTML(' + p.id + ');">';
  }
  return fallbackHTML(p.id);
}

function fallbackHTML(id) {
  const p = phones.find(x => x.id === id);
  return '<div class="card-fallback">' +
    '<div class="badge">' + p.brand + '</div>' +
    '<div class="shape">📱</div>' +
    '<div class="name">' + p.name + '</div>' +
  '</div>';
}

function planTabHTML(weeks, available, active) {
  const info = planInfo(weeks);
  const cls = (available ? '' : 'disabled') + ' ' + (active ? 'active' : '');
  return '<div class="plan-tab ' + cls + '" ' +
    (available ? 'onclick="selectPlan(' + weeks + ',this)"' : '') + '>' +
    '<span class="mo">' + info.months + '</span>' +
    '<span class="wk">' + info.payments + '</span>' +
  '</div>';
}

function renderCards() {
  const allPlans = [13, 17, 26, 39];
  document.getElementById('grid').innerHTML = phones.map(p => {
    const available = allPlans.filter(w => p['w' + w]);
    const firstPlan = available[0] || 13;
    const tabs = allPlans.map(w => planTabHTML(w, !!p['w'+w], w === firstPlan)).join('');

    return '<div class="card">' +
      '<div class="card-img">' + cardImageHTML(p) + '</div>' +
      '<h3>' + p.name + '</h3>' +
      '<p>' + p.model + '</p>' +
      '<div class="dp"><div class="lbl">' + t('downPayment') + '</div><div class="amt">' + formatNaira(p.dp) + '</div></div>' +
      '<div class="plan-lbl">' + t('choosePlan') + '</div>' +
      '<div class="plan-tabs" id="tabs-' + p.id + '">' + tabs + '</div>' +
      '<div class="selected-box"><div class="lbl">' + t('youSelected') + '</div><div class="val" id="sel-' + p.id + '"></div><div class="sub" id="selsub-' + p.id + '"></div></div>' +
      '<div id="brk-' + p.id + '"></div>' +
      '<button class="order-btn" onclick="openOrder(' + p.id + ')">' + t('orderBtn') + '</button>' +
    '</div>';
  }).join('');

  phones.forEach(p => {
    const available = [13, 17, 26, 39].filter(w => p['w' + w]);
    if (available.length) showBreakdown(p.id, available[0]);
  });
}

function selectPlan(weeks, el) {
  const card = el.closest('.card');
  card.querySelectorAll('.plan-tab').forEach(x => x.classList.remove('active'));
  el.classList.add('active');
  const phoneId = parseInt(card.querySelector('.plan-tabs').id.replace('tabs-',''));
  showBreakdown(phoneId, weeks);
}

function showBreakdown(phoneId, weeks) {
  const p = phones.find(x => x.id === phoneId);
  const weekly = p['w' + weeks];
  if (!weekly) return;
  const info = planInfo(weeks);
  document.getElementById('sel-' + phoneId).textContent = info.months;
  document.getElementById('selsub-' + phoneId).textContent = '(' + info.payments + ')';
  const total = weekly * weeks;
  const grand = p.dp + total;
  document.getElementById('brk-' + phoneId).innerHTML =
    '<div class="row"><span class="k">' + t('weekly') + ' × ' + info.payments + '</span><span class="v">' + formatNaira(weekly) + '</span></div>' +
    '<div class="row"><span class="k">' + t('totalOutstanding') + '</span><span class="v">' + formatNaira(total) + '</span></div>' +
    '<div class="row total"><span class="k">' + t('totalCost') + '</span><span class="v">' + formatNaira(grand) + '</span></div>';
}

let currentOrder = null;

function openOrder(phoneId) {
  const p = phones.find(x => x.id === phoneId);
  const activeTab = document.querySelector('#tabs-' + phoneId + ' .plan-tab.active');
  const weeks = activeTab ? planWeeksFromTab(activeTab) : 13;
  currentOrder = { phone: p, weeks: weeks };
  refreshModal();
  document.getElementById('overlay').classList.add('show');
}

function planWeeksFromTab(tabEl) {
  const mo = tabEl.querySelector('.mo').textContent;
  for (const w in PLAN_INFO) {
    if (PLAN_INFO[w][LANG].months === mo) return parseInt(w);
  }
  return 13;
}

function refreshModal() {
  const p = currentOrder.phone;
  const weeks = currentOrder.weeks;
  const info = planInfo(weeks);
  const weekly = p['w' + weeks];
  const total = weekly * weeks;
  const grand = p.dp + total;

  document.getElementById('planBadge').innerHTML =
    '<div class="lbl">' + t('youSelected') + '</div>' +
    '<div class="val">' + info.months + '</div>' +
    '<div class="sub">' + info.payments + '</div>';

  const allPlans = [13, 17, 26, 39];
  const tabs = allPlans.map(w => planTabHTML(w, !!p['w'+w], w === weeks).replace(/onclick="selectPlan\((\d+),this\)"/, 'onclick="switchPlan($1)"')).join('');

  document.getElementById('summary').innerHTML =
    '<div style="margin-bottom:14px;"><strong style="color:#00d4ff;">' + p.name + '</strong> — ' + p.model + '</div>' +
    '<div class="plan-lbl">' + t('changePlan') + '</div>' +
    '<div class="plan-tabs" style="margin-bottom:14px;">' + tabs + '</div>' +
    '<div class="row"><span class="k">' + t('downPayment') + '</span><span class="v">' + formatNaira(p.dp) + '</span></div>' +
    '<div class="row"><span class="k">' + t('weekly') + ' × ' + info.payments + '</span><span class="v">' + formatNaira(weekly) + '</span></div>' +
    '<div class="row"><span class="k">' + t('totalOutstanding') + '</span><span class="v">' + formatNaira(total) + '</span></div>' +
    '<div class="row total"><span class="k">' + t('totalCost') + '</span><span class="v">' + formatNaira(grand) + '</span></div>' +
    '<div style="height:14px;"></div>';
}

function switchPlan(weeks) { currentOrder.weeks = weeks; refreshModal(); }
function closeModal() { document.getElementById('overlay').classList.remove('show'); }

function sendWhatsApp() {
  const p = currentOrder.phone;
  const weeks = currentOrder.weeks;
  const info = planInfo(weeks);
  const weekly = p['w' + weeks];
  const total = weekly * weeks;
  const grand = p.dp + total;

  const name = document.getElementById('cName').value.trim();
  const phone = document.getElementById('cPhone').value.trim();
  const address = document.getElementById('cAddress').value.trim();
  const notes = document.getElementById('cNotes').value.trim();

  if (!name || !phone || !address) {
    alert(t('confirmMsg'));
    return;
  }

  let msg = '';
  msg += '🛒 *NEW ORDER — Easy Buy*\n\n';
  msg += '📱 *Phone:* ' + p.name + '\n';
  msg += '💾 *Model:* ' + p.model + '\n\n';
  msg += '📋 *Plan:* ' + info.months + ' (' + info.payments + ')\n';
  msg += '💰 *Down Payment:* ' + formatNaira(p.dp) + '\n';
  msg += '📅 *Weekly Payment:* ' + formatNaira(weekly) + '\n';
  msg += '📊 *Total Outstanding:* ' + formatNaira(total) + '\n';
  msg += '💵 *Total Cost:* ' + formatNaira(grand) + '\n\n';
  msg += '👤 *Name:* ' + name + '\n';
  msg += '📞 *Phone:* ' + phone + '\n';
  msg += '📍 *Address:* ' + address + '\n';
  if (notes) msg += '📝 *Notes:* ' + notes + '\n';

  try {
    fetch('/api/order', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        customer_name: name, customer_phone: phone, customer_address: address, notes: notes,
        phone_model: p.name + ' — ' + p.model,
        plan_label: info.months + ' (' + info.payments + ')',
        down_payment: p.dp, weeks: weeks, weekly_payment: weekly,
        total_outstanding: total, total_cost: grand
      })
    }).catch(() => {});
  } catch (e) {}

  const url = 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(msg);
  window.open(url, '_blank');
}

try {
  const saved = localStorage.getItem('easybuy_lang');
  if (saved === 'en' || saved === 'ha') setLang(saved);
} catch(e) {}
</script>
