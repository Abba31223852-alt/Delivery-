<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Easy Buy — Test Version</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Inter',sans-serif; background:#070b14; color:#fff; }
  nav { padding:16px 30px; background:rgba(7,11,20,0.85); border-bottom:1px solid rgba(255,255,255,0.06); display:flex; justify-content:space-between; align-items:center; }
  .logo { font-size:22px; font-weight:900; }
  .logo span { color:#00d4ff; }
  .test-banner { background:#ffc107; color:#000; padding:10px; text-align:center; font-weight:700; font-size:14px; }
  .section { padding:40px 20px; max-width:1300px; margin:0 auto; }
  .section-title h2 { font-size:32px; font-weight:900; margin-bottom:10px; text-align:center; }
  .section-title p { text-align:center; color:rgba(255,255,255,0.5); margin-bottom:40px; }
  .phones-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:20px; }
  .phone-card { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); border-radius:20px; padding:20px; }
  .phone-img-box { width:100%; height:240px; background:#0a1220; border-radius:14px; overflow:hidden; margin-bottom:16px; display:flex; align-items:center; justify-content:center; }
  .phone-img-box img { width:100%; height:100%; object-fit:contain; }
  .phone-auto-card { width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; text-align:center; background:linear-gradient(135deg,#0a1220,#0f1a30); }
  .phone-auto-card .brand-badge { font-size:11px; font-weight:800; letter-spacing:2px; color:#00d4ff; text-transform:uppercase; padding:5px 14px; border-radius:50px; background:rgba(0,212,255,0.1); border:1px solid rgba(0,212,255,0.3); margin-bottom:14px; }
  .phone-auto-card .phone-shape { width:72px; height:135px; border:2px solid rgba(0,212,255,0.5); border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:34px; margin-bottom:16px; }
  .phone-auto-card .phone-name { font-size:15px; font-weight:800; margin-bottom:4px; }
  .phone-auto-card .phone-spec { font-size:12px; color:rgba(255,255,255,0.5); }
  .phone-card h3 { font-size:17px; font-weight:800; margin-bottom:4px; }
  .phone-card p { font-size:13px; color:rgba(255,255,255,0.5); }
</style>
</head>
<body>
<div class="test-banner">⚠️ TEST VERSION — Not the live site</div>
<nav><div class="logo">Easy<span>Buy</span> Test</div></nav>
<section class="section">
  <div class="section-title">
    <h2>Test Phone Images</h2>
    <p>If you like this, we copy it to the real site. If not, we delete it.</p>
  </div>
  <div class="phones-grid" id="phonesGrid"></div>
</section>

<script>
const phones = [
  { id:1, name:"Itel A100cs", model:"A6611L 64/2 GB Vintage Green", brand:"Itel", image:"https://www.itel-life.com/fileadmin/assets/img/plp/A100CS/A100Cs-Cloud_White.png" },
  { id:2, name:"Itel A300+", model:"A681L 64/4 GB Black", brand:"Itel", image:"https://ng.itelhome.shop/cdn/shop/files/itel_A300_Smartphone_with_7000mAh_Battery_2.01_Rear_Display_120Hz_Screen.webp?v=1789640204&width=3240" },
  { id:3, name:"Itel A300+", model:"A681L 128/4 GB Black", brand:"Itel", image:"https://ng.itelhome.shop/cdn/shop/files/20260921-100848.webp?v=1789981787&width=2160" },
  { id:4, name:"Itel A100CS", model:"A6611L 32/2 GB Red", brand:"Itel", image:"https://www.mobiledokan.com/media/itel-a100cs-natural-black-official-image.webp" },
  { id:5, name:"Itel CITY 200s", model:"C681LN 128/4 GB Gray", brand:"Itel", image:"" },
  { id:6, name:"Infinix HOT 70", model:"X6895 128/4 GB Grey", brand:"Infinix", image:"https://d3o31au25zfcly.cloudfront.net/newfileadmin/usp/hot-70/sec1/pc/kv_ng_pc.webp" },
  { id:7, name:"Infinix HOT 70", model:"X6895B 256/6 GB Grey", brand:"Infinix", image:"https://global.pro.infinixmobility.com/media/wysiwyg/X6895_X6895B_HOT70_Family_series_Base_4.webp" },
  { id:8, name:"TECNO Spark 50", model:"128/4 GB Grey", brand:"TECNO", image:"https://d13pvy8xd75yde.cloudfront.net/global/spark50_kn4_kn4n/en/KN4_7000mAh/assets/section1-kv-7000_mobile.webp" },
  { id:9, name:"TECNO Spark 50 Pro", model:"KO5 128/6 GB Black", brand:"TECNO", image:"https://d13pvy8xd75yde.cloudfront.net/global/spark50pro_ko5/en/assets/kv-bg_mobile.webp" },
  { id:10, name:"TECNO POP 10 Pro", model:"KM4k 128/4 GB Nebula Violet", brand:"TECNO", image:"https://d13pvy8xd75yde.cloudfront.net/global/phones/spark-40c/km4k_v1.0.0_complete/pop-10-pro/mb/kv.jpg" },
  { id:11, name:"TECNO Pop 20", model:"Kn3 64/4 GB Grey", brand:"TECNO", image:"https://d13pvy8xd75yde.cloudfront.net/global/sparkgo3-pop20/pop-20/en/images/webp/kn3-section01-banner_m.jpg.webp" }
];

function autoCardHTML(p) {
  return '<div class="phone-auto-card">' +
    '<div class="brand-badge">' + p.brand + '</div>' +
    '<div class="phone-shape">📱</div>' +
    '<div class="phone-name">' + p.name + '</div>' +
    '<div class="phone-spec">' + p.model + '</div>' +
  '</div>';
}

function imageHTML(p) {
  if (p.image && p.image.trim() !== "") {
    return '<img src="' + p.image + '" alt="' + p.name + '" onerror="this.parentElement.innerHTML=autoCardHTML(' + JSON.stringify(p).replace(/"/g,'&quot;') + ');">';
  }
  return autoCardHTML(p);
}

document.getElementById('phonesGrid').innerHTML = phones.map(p =>
  '<div class="phone-card">' +
    '<div class="phone-img-box">' + imageHTML(p) + '</div>' +
    '<h3>' + p.name + '</h3>' +
    '<p>' + p.model + '</p>' +
  '</div>'
).join('');
</script>
</body>
</html>
