<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SwiftDrop Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: #070b14; color: #fff; min-height: 100vh; }

  /* LOGIN SCREEN */
  .login-screen {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px;
    background: radial-gradient(ellipse at top, rgba(0, 114, 255, 0.15), transparent 70%);
  }
  .login-card {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(0, 212, 255, 0.2);
    border-radius: 24px; padding: 45px;
    width: 100%; max-width: 400px;
    backdrop-filter: blur(20px);
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
  }
  .login-card h1 {
    font-size: 28px; font-weight: 900; margin-bottom: 8px; text-align: center;
  }
  .login-card h1 span {
    background: linear-gradient(135deg, #00d4ff, #0072ff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .login-card .sub { text-align: center; color: rgba(255, 255, 255, 0.4); font-size: 14px; margin-bottom: 30px; }
  .login-card input {
    width: 100%; padding: 16px 20px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 14px; color: #fff; font-size: 15px;
    outline: none; margin-bottom: 15px;
    transition: 0.3s;
  }
  .login-card input:focus {
    border-color: #00d4ff; box-shadow: 0 0 0 4px rgba(0, 212, 255, 0.12);
  }
  .login-card button {
    width: 100%; padding: 16px;
    background: linear-gradient(135deg, #00d4ff, #0072ff);
    color: #fff; border: none; border-radius: 14px;
    font-weight: 700; font-size: 16px; cursor: pointer;
    transition: 0.3s;
  }
  .login-card button:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(0, 212, 255, 0.4); }
  .login-card .hint {
    margin-top: 20px; padding: 12px;
    background: rgba(0, 212, 255, 0.08); border: 1px solid rgba(0, 212, 255, 0.2);
    border-radius: 10px; font-size: 13px; color: rgba(255, 255, 255, 0.6); text-align: center;
  }

  /* DASHBOARD */
  .dashboard { display: none; padding: 30px; max-width: 1200px; margin: 0 auto; }
  .dash-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 30px; padding-bottom: 25px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }
  .dash-header h1 { font-size: 28px; font-weight: 900; }
  .dash-header h1 span { color: #00d4ff; }
  .logout-btn {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #fff; padding: 10px 24px; border-radius: 50px;
    font-weight: 600; cursor: pointer; font-size: 14px;
    transition: 0.3s;
  }
  .logout-btn:hover { border-color: #ff6b6b; color: #ff6b6b; }

  /* STATS */
  .dash-stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px; margin-bottom: 35px;
  }
  .stat-box {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 18px; padding: 25px;
  }
  .stat-box .num {
    font-size: 36px; font-weight: 900; letter-spacing: -1px;
    background: linear-gradient(135deg, #00d4ff, #0072ff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .stat-box .lbl { font-size: 13px; color: rgba(255, 255, 255, 0.5); margin-top: 6px; font-weight: 600; }

  /* TABS */
  .tabs { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
  .tab-btn {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: rgba(255, 255, 255, 0.7);
    padding: 12px 24px; border-radius: 50px;
    font-weight: 600; cursor: pointer; font-size: 14px;
    transition: 0.3s;
  }
  .tab-btn.active {
    background: linear-gradient(135deg, #00d4ff, #0072ff);
    border-color: transparent; color: #fff;
  }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* CARD */
  .panel {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 20px; padding: 30px; margin-bottom: 20px;
  }
  .panel h3 { font-size: 18px; margin-bottom: 20px; font-weight: 800; }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
  .panel input, .panel select, .panel textarea {
    width: 100%; padding: 14px 18px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px; color: #fff; font-size: 14px;
    outline: none; margin-bottom: 15px;
    font-family: 'Inter', sans-serif; transition: 0.3s;
  }
  .panel input:focus, .panel select:focus, .panel textarea:focus {
    border-color: #00d4ff; box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.12);
  }
  .panel select option { background: #0a0e1a; }
  .panel button {
    background: linear-gradient(135deg, #00d4ff, #0072ff);
    color: #fff; border: none; padding: 14px 30px;
    border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 15px;
    transition: 0.3s;
  }
  .panel button:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0, 212, 255, 0.35); }

  /* TABLE */
  .data-table { width: 100%; border-collapse: collapse; }
  .data-table th {
    text-align: left; padding: 14px 16px;
    font-size: 12px; font-weight: 700; text-transform: uppercase;
    color: rgba(255, 255, 255, 0.5); letter-spacing: 1px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }
  .data-table td {
    padding: 16px; font-size: 14px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    color: rgba(255, 255, 255, 0.85);
  }
  .data-table tr:hover td { background: rgba(0, 212, 255, 0.03); }
  .status-pill {
    display: inline-block; padding: 5px 14px;
    border-radius: 50px; font-size: 12px; font-weight: 700;
  }
  .status-InTransit { background: rgba(255, 193, 7, 0.15); color: #ffc107; }
  .status-OutforDelivery { background: rgba(0, 212, 255, 0.15); color: #00d4ff; }
  .status-Delivered { background: rgba(76, 175, 80, 0.15); color: #4caf50; }
  .status-Pending { background: rgba(255, 107, 107, 0.15); color: #ff6b6b; }

  .empty-state { text-align: center; padding: 40px; color: rgba(255, 255, 255, 0.3); }

  @media (max-width: 700px) {
    .dashboard { padding: 20px; }
    .form-row { grid-template-columns: 1fr; }
    .data-table { font-size: 12px; }
    .data-table th, .data-table td { padding: 10px 8px; }
    .dash-header { flex-direction: column; gap: 15px; align-items: flex-start; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <h1>Swift<span>Drop</span> Admin</h1>
    <p class="sub">Staff Access Only</p>
    <input type="password" id="adminPass" placeholder="Enter admin password" onkeypress="if(event.key==='Enter') login()">
    <button onclick="login()">Login to Dashboard</button>
    <div class="hint">Demo password: <strong>admin123</strong></div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">
  <div class="dash-header">
    <h1>Admin <span>Dashboard</span></h1>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <div class="dash-stats">
    <div class="stat-box"><div class="num" id="totalTracking">0</div><div class="lbl">Total Shipments</div></div>
    <div class="stat-box"><div class="num" id="totalMessages">0</div><div class="lbl">Messages</div></div>
    <div class="stat-box"><div class="num" id="deliveredCount">0</div><div class="lbl">Delivered</div></div>
    <div class="stat-box"><div class="num" id="inTransitCount">0</div><div class="lbl">In Transit</div></div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('tracking', this)">📦 Tracking</button>
    <button class="tab-btn" onclick="switchTab('messages', this)">📬 Messages</button>
    <button class="tab-btn" onclick="switchTab('add', this)">➕ Add Tracking</button>
  </div>

  <!-- TRACKING TAB -->
  <div class="tab-content active" id="tab-tracking">
    <div class="panel">
      <h3>All Shipments</h3>
      <div id="trackingTable"></div>
    </div>
  </div>

  <!-- MESSAGES TAB -->
  <div class="tab-content" id="tab-messages">
    <div class="panel">
      <h3>Customer Messages</h3>
      <div id="messagesList"></div>
    </div>
  </div>

  <!-- ADD TAB -->
  <div class="tab-content" id="tab-add">
    <div class="panel">
      <h3>Add New Tracking Number</h3>
      <div class="form-row">
        <input type="text" id="newTrackNum" placeholder="Tracking Number e.g. SD-2024-001234">
        <select id="newStatus">
          <option>Pending</option>
          <option>In Transit</option>
          <option>Out for Delivery</option>
          <option>Delivered</option>
        </select>
      </div>
      <input type="text" id="newLocation" placeholder="Location e.g. Lagos Sorting Center">
      <button onclick="addTracking()">Add Tracking</button>
    </div>
  </div>
</div>

<script>
  const ADMIN_PASSWORD = "admin123";

  function login() {
    const pass = document.getElementById('adminPass').value;
    if (pass === ADMIN_PASSWORD) {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadAll();
    } else {
      alert('Wrong password');
    }
  }

  function logout() {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('adminPass').value = '';
  }

  function switchTab(name, btn) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
    btn.classList.add('active');
  }

  async function loadAll() {
    await loadTracking();
    await loadMessages();
  }

  async function loadTracking() {
    const res = await fetch('/api/admin/tracking');
    const data = await res.json();
    const table = document.getElementById('trackingTable');

    document.getElementById('totalTracking').textContent = data.length;
    document.getElementById('deliveredCount').textContent = data.filter(d => d.status === 'Delivered').length;
    document.getElementById('inTransitCount').textContent = data.filter(d => d.status === 'In Transit').length;

    if (data.length === 0) {
      table.innerHTML = '<div class="empty-state">No tracking numbers yet</div>';
      return;
    }

    let html = '<table class="data-table"><thead><tr><th>Tracking #</th><th>Status</th><th>Location</th><th>Updated</th></tr></thead><tbody>';
    data.forEach(item => {
      const statusClass = 'status-' + item.status.replace(/\s/g, '');
      html += `<tr>
        <td><strong>${item.tracking_number}</strong></td>
        <td><span class="status-pill ${statusClass}">${item.status}</span></td>
        <td>${item.location}</td>
        <td>${new Date(item.updated_at).toLocaleString()}</td>
      </tr>`;
    });
    html += '</tbody></table>';
    table.innerHTML = html;
  }

  async function loadMessages() {
    const res = await fetch('/api/admin/messages');
    const data = await res.json();
    const list = document.getElementById('messagesList');

    document.getElementById('totalMessages').textContent = data.length;

    if (data.length === 0) {
      list.innerHTML = '<div class="empty-state">No messages yet</div>';
      return;
    }

    let html = '';
    data.reverse().forEach(m => {
      html += `<div style="padding: 20px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 14px; margin-bottom: 15px;">
        <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:10px;">
          <strong style="color: #00d4ff;">${m.name}</strong>
          <span style="color: rgba(255,255,255,0.4); font-size: 13px;">${new Date(m.created_at).toLocaleString()}</span>
        </div>
        <div style="font-size: 13px; color: rgba(255,255,255,0.6); margin-bottom: 10px;">
          📞 ${m.phone} &nbsp; | &nbsp; ✉️ ${m.email} &nbsp; | &nbsp; 📦 ${m.service}
        </div>
        <div style="font-size: 14px; color: rgba(255,255,255,0.8);">${m.message}</div>
      </div>`;
    });
    list.innerHTML = html;
  }

  async function addTracking() {
    const tracking_number = document.getElementById('newTrackNum').value.trim();
    const status = document.getElementById('newStatus').value;
    const location = document.getElementById('newLocation').value.trim();

    if (!tracking_number || !location) {
      alert('Please fill in all fields');
      return;
    }

    const res = await fetch('/api/admin/tracking', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tracking_number, status, location })
    });

    if (res.ok) {
      alert('Tracking number added!');
      document.getElementById('newTrackNum').value = '';
      document.getElementById('newLocation').value = '';
      loadTracking();
    } else {
      alert('Error adding tracking');
    }
  }
</script>
</body>
</html>
